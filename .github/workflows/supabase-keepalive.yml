# Un projet Supabase gratuit est mis en pause après 7 jours sans requête. Une
# semaine calme sur le site suffirait donc à le faire tomber. Une requête
# hebdomadaire le garde éveillé.
#
# Secrets à créer (Settings > Secrets and variables > Actions) :
#   SUPABASE_URL       https://xxxx.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  la clé publiable, la même que celle du bundle
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller le projet
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/current_prices?limit=1" \
            > /dev/null
